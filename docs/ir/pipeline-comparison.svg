<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ptoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c7a8b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tileirGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b4c9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5f7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c7a8b;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">PTO vs TileIR 编译流水线对比</text>
  
  <!-- PTO Pipeline (Left Side) -->
  <rect x="50" y="80" width="320" height="480" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="80" width="320" height="40" rx="10" fill="url(#ptoGradient)"/>
  <text x="210" y="107" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">PTO 编译流水线</text>
  
  <!-- PTO Components -->
  <!-- pyPTO Frontend -->
  <rect x="80" y="150" width="120" height="60" rx="8" fill="#0ea5e9"/>
  <text x="140" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">pyPTO</text>
  <text x="140" y="190" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(Python 前端)</text>
  
  <!-- Arrow -->
  <line x1="140" y1="210" x2="140" y2="240" stroke="#1a5f7a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <polygon points="140,240 135,230 145,230" fill="#1a5f7a"/>
  
  <!-- PTOAS -->
  <rect x="80" y="240" width="120" height="60" rx="8" fill="#0ea5e9"/>
  <text x="140" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PTOAS</text>
  <text x="140" y="280" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(MLIR Dialect)</text>
  
  <!-- Arrow -->
  <line x1="140" y1="300" x2="140" y2="330" stroke="#1a5f7a" stroke-width="2"/>
  <polygon points="140,330 135,320 145,320" fill="#1a5f7a"/>
  
  <!-- PTOBC -->
  <rect x="80" y="330" width="120" height="60" rx="8" fill="#0d9488"/>
  <text x="140" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PTOBC</text>
  <text x="140" y="370" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(Bytecode)</text>
  
  <!-- Arrow -->
  <line x1="140" y1="390" x2="140" y2="420" stroke="#1a5f7a" stroke-width="2"/>
  <polygon points="140,420 135,410 145,410" fill="#1a5f7a"/>
  
  <!-- PTO ISA -->
  <rect x="80" y="420" width="120" height="60" rx="8" fill="#0d9488"/>
  <text x="140" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PTO ISA</text>
  <text x="140" y="460" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(Virtual ISA)</text>
  
  <!-- Arrow -->
  <line x1="140" y1="480" x2="140" y2="510" stroke="#1a5f7a" stroke-width="2"/>
  <polygon points="140,510 135,500 145,500" fill="#1a5f7a"/>
  
  <!-- Hardware -->
  <rect x="80" y="510" width="120" height="40" rx="8" fill="#059669"/>
  <text x="140" y="535" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Hardware</text>
  
  <!-- TileIR Pipeline (Right Side) -->
  <rect x="430" y="80" width="320" height="480" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="80" width="320" height="40" rx="10" fill="url(#tileirGradient)"/>
  <text x="590" y="107" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">TileIR 编译流水线</text>
  
  <!-- CuTile -->
  <rect x="460" y="150" width="120" height="60" rx="8" fill="#8b5cf6"/>
  <text x="520" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">CuTile</text>
  <text x="520" y="190" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(Python 前端)</text>
  
  <!-- Arrow -->
  <line x1="520" y1="210" x2="520" y2="240" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="520,240 515,230 525,230" fill="#8b5cf6"/>
  
  <!-- HIR -->
  <rect x="460" y="240" width="120" height="50" rx="8" fill="#7c3aed"/>
  <text x="520" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">HIR</text>
  <text x="520" y="275" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(High-level IR)</text>
  
  <!-- Arrow -->
  <line x1="520" y1="290" x2="520" y2="320" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="520,320 515,310 525,310" fill="#8b5cf6"/>
  
  <!-- cuda_tile -->
  <rect x="460" y="320" width="120" height="50" rx="8" fill="#7c3aed"/>
  <text x="520" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">cuda_tile</text>
  <text x="520" y="355" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(MLIR Dialect)</text>
  
  <!-- Arrow -->
  <line x1="520" y1="370" x2="520" y2="400" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="520,400 515,390 525,390" fill="#8b5cf6"/>
  
  <!-- nv_tileaa -->
  <rect x="460" y="400" width="120" height="50" rx="8" fill="#6d28d9"/>
  <text x="520" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">nv_tileaa</text>
  <text x="520" y="435" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(Arch-Agnostic)</text>
  
  <!-- Arrow -->
  <line x1="520" y1="450" x2="520" y2="480" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="520,480 515,470 525,470" fill="#8b5cf6"/>
  
  <!-- nv_tileas -->
  <rect x="460" y="480" width="120" height="50" rx="8" fill="#5b21b6"/>
  <text x="520" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">nv_tileas</text>
  <text x="520" y="515" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(Arch-Specific)</text>
  
  <!-- Bottom: SASS -->
  <rect x="520" y="540" width="120" height="30" rx="8" fill="#4c1d95"/>
  <text x="560" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">SASS</text>
  
  <!-- Note -->
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">PTO: 多硬件后端 (NPU/GPU) | TileIR: NVIDIA GPU 专用</text>
</svg>
