site_name: PTO Virtual ISA Manual
site_description: >
  PTO (Parallel Tile Operation) is a virtual instruction set architecture 
  designed by Ascend CANN, focusing on tile-level operations.
site_author: Ascend CANN
site_url: https://pto-isa.gitcode.com

# Repository links
repo_name: PTO-ISA
repo_url: https://gitcode.com/cann/pto-isa
edit_uri: edit/main/docs/mkdocs/src/

# Theme configuration
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - header.autohide
  icon:
    repo: fontawesome/brands/gitlab
  palette:
    primary: deep blue
    accent: light blue

# Build settings
docs_dir: src
site_dir: ../../site

# Plugins
plugins:
  - search:
      lang: en
  - redirects:
      redirect_maps:
        'manual/index.md': 'manual/01-overview.md'
        'coding/intro.md': 'coding/ProgrammingModel.md'
  - gen-files:
      scripts:
        - gen_pages.py

# Markdown extensions
markdown_extensions:
  - toc:
      permalink: true
      baselevel: 1
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [dollar, round]
      block_syntax: [dollar, square]
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.mark
  - attr_list
  - def_list

# Extra JavaScript for math rendering
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/language-switcher.js

# Social links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ascend/pto-isa
      title: GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitcode.com/cann/pto-isa
      title: GitCode

# Copyright
copyright: >
  &copy; 2025-2026 Ascend CANN. 
  Licensed under CANN Open Software License Agreement Version 2.0.

