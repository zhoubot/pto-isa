<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="550" viewBox="0 0 850 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tokenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eventGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="850" height="550" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="425" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">内存模型对比：Token 令牌 vs Event 事件</text>
  
  <!-- ==================== LEFT: TileIR Token Model ==================== -->
  <rect x="30" y="60" width="380" height="460" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="30" y="60" width="380" height="30" rx="10" fill="#7c3aed"/>
  <text x="220" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">TileIR: Token-Based Ordering (TKO)</text>
  
  <!-- Token Flow -->
  <text x="220" y="110" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">令牌驱动：只有拿到令牌才能执行下一步</text>
  
  <!-- Token 1: Load -->
  <rect x="80" y="130" width="280" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="220" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">1. load_view_tko</text>
  <text x="220" y="168" font-family="Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">weak → 产生 token0</text>
  
  <!-- Arrow -->
  <line x1="220" y1="180" x2="220" y2="200" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="220,200 215,190 225,190" fill="#f59e0b"/>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b">token0</text>
  
  <!-- Token 2: MMA -->
  <rect x="80" y="200" width="280" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="220" y="220" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">2. mmaf</text>
  <text x="220" y="238" font-family="Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">消耗 token0 → 产生 token1</text>
  
  <!-- Arrow -->
  <line x1="220" y1="250" x2="220" y2="270" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="220,270 215,260 225,260" fill="#f59e0b"/>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b">token1</text>
  
  <!-- Token 3: Store -->
  <rect x="80" y="270" width="280" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="220" y="290" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">3. store_view_tko</text>
  <text x="220" y="308" font-family="Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">消耗 token1 → acq_rel</text>
  
  <!-- Token Types -->
  <rect x="80" y="340" width="280" height="160" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="220" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Token 类型</text>
  
  <rect x="100" y="375" width="240" height="25" rx="4" fill="#fee2e2"/>
  <text x="220" y="392" font-family="Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">weak / relaxed - 无 Happens-Before</text>
  
  <rect x="100" y="405" width="240" height="25" rx="4" fill="#fef3c7"/>
  <text x="220" y="422" font-family="Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">acquire - 获取之前写入</text>
  
  <rect x="100" y="435" width="240" height="25" rx="4" fill="#d1fae5"/>
  <text x="220" y="452" font-family="Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle">release - 释放写入</text>
  
  <!-- ==================== RIGHT: PTO Event Model ==================== -->
  <rect x="440" y="60" width="380" height="460" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="440" y="60" width="380" height="30" rx="10" fill="#0891b2"/>
  <text x="630" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PTO: Event + TSYNC 模型</text>
  
  <!-- Event Flow -->
  <text x="630" y="110" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">事件驱动：显式依赖声明 + 同步点</text>
  
  <!-- Event 1: Load -->
  <rect x="490" y="130" width="280" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="630" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">1. tload (隐式产生事件)</text>
  <text x="630" y="168" font-family="Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle">自动产生事件 e1</text>
  
  <!-- Arrow -->
  <line x1="630" y1="180" x2="630" y2="200" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="630,200 625,190 635,190" fill="#3b82f6"/>
  
  <!-- Event 2: MMA -->
  <rect x="490" y="200" width="280" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="630" y="220" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">2. tmatmul (依赖加载事件)</text>
  <text x="630" y="238" font-family="Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle">依赖 e1，自动产生 e2</text>
  
  <!-- Arrow -->
  <line x1="630" y1="250" x2="630" y2="270" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="630,270 625,260 635,260" fill="#3b82f6"/>
  
  <!-- TSYNC -->
  <rect x="490" y="270" width="280" height="50" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="630" y="290" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9d174d" text-anchor="middle">3. tsync (显式同步点)</text>
  <text x="630" y="308" font-family="Arial, sans-serif" font-size="9" fill="#831843" text-anchor="middle">确保 e2 完成，后续操作可见</text>
  
  <!-- Arrow -->
  <line x1="630" y1="320" x2="630" y2="340" stroke="#ec4899" stroke-width="2"/>
  <polygon points="630,340 625,330 635,330" fill="#ec4899"/>
  
  <!-- Store -->
  <rect x="490" y="340" width="280" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="630" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">4. tstore (依赖 tsync)</text>
  <text x="630" y="378" font-family="Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle">等待同步点完成</text>
  
  <!-- Key Points -->
  <rect x="490" y="410" width="280" height="90" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="630" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">关键特性</text>
  <text x="630" y="450" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• 隐式事件依赖：操作自动产生事件</text>
  <text x="630" y="468" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• TSYNC 同步点：显式等待完成</text>
  <text x="630" y="486" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• DPS：Destination-Passing Style</text>
  
  <!-- Legend -->
  <text x="425" y="535" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">TileIR: 令牌传递 | PTO: 事件驱动 + 显式同步</text>
</svg>
