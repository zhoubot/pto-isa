<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="memoryGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="viewGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">数据模型层级对比：Tensor View → Partition → Tile</text>
  
  <!-- ==================== LEFT SIDE: PTO ==================== -->
  <rect x="30" y="70" width="340" height="400" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="30" y="70" width="340" height="30" rx="10" fill="#1a5f7a"/>
  <text x="200" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PTO 数据模型</text>
  
  <!-- Global Tensor -->
  <rect x="60" y="130" width="280" height="80" rx="8" fill="url(#memoryGradient)" filter="url(#shadow)"/>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">GlobalTensor / tensor_view</text>
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">dtype=f32, shape=[1,1,16,1024,1024]</text>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">strides=[1048576,1048576,1048576,1024,1]</text>
  
  <!-- Arrow down -->
  <line x1="200" y1="210" x2="200" y2="235" stroke="#1a5f7a" stroke-width="2"/>
  <polygon points="200,235 195,225 205,225" fill="#1a5f7a"/>
  <text x="220" y="228" font-family="Arial, sans-serif" font-size="9" fill="#64748b">partition_view</text>
  
  <!-- Partition View -->
  <rect x="60" y="235" width="280" height="70" rx="8" fill="url(#viewGradient)" filter="url(#shadow)"/>
  <text x="200" y="258" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">partition_tensor_view</text>
  <text x="200" y="278" font-family="Arial, sans-serif" font-size="10" fill="#f3e8ff" text-anchor="middle">offsets=[0,0,0,0,0], sizes=[1,1,16,16,16]</text>
  
  <!-- Arrow down -->
  <line x1="200" y1="305" x2="200" y2="330" stroke="#1a5f7a" stroke-width="2"/>
  <polygon points="200,330 195,320 205,320" fill="#1a5f7a"/>
  <text x="220" y="323" font-family="Arial, sans-serif" font-size="9" fill="#64748b">tload</text>
  
  <!-- Tile Buffer -->
  <rect x="60" y="330" width="280" height="120" rx="8" fill="url(#tileGradient)" filter="url(#shadow)"/>
  <text x="200" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">tile_buf</text>
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">loc=acc, dtype=f32, rows=16, cols=16</text>
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">v_row=16, v_col=16, blayout=RowMajor</text>
  <text x="200" y="405" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">slayout=row_major, fractal=512</text>
  
  <!-- ==================== RIGHT SIDE: TileIR ==================== -->
  <rect x="430" y="70" width="340" height="400" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="430" y="70" width="340" height="30" rx="10" fill="#6b4c9a"/>
  <text x="600" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">TileIR 数据模型</text>
  
  <!-- Tensor View -->
  <rect x="460" y="130" width="280" height="80" rx="8" fill="url(#memoryGradient)" filter="url(#shadow)"/>
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">tensor_view</text>
  <text x="600" y="175" font-family="Arial, sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">shape=[1024, 1024], strides=[1024, 1]</text>
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">element_type=f32</text>
  
  <!-- Arrow down -->
  <line x1="600" y1="210" x2="600" y2="235" stroke="#6b4c9a" stroke-width="2"/>
  <polygon points="600,235 595,225 605,225" fill="#6b4c9a"/>
  <text x="620" y="228" font-family="Arial, sans-serif" font-size="9" fill="#64748b">partition</text>
  
  <!-- Partition Tensor View -->
  <rect x="460" y="235" width="280" height="70" rx="8" fill="url(#viewGradient)" filter="url(#shadow)"/>
  <text x="600" y="258" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">partition_tensor_view</text>
  <text x="600" y="278" font-family="Arial, sans-serif" font-size="10" fill="#f3e8ff" text-anchor="middle">offsets=[0, 0], sizes=[16, 16]</text>
  
  <!-- Arrow down -->
  <line x1="600" y1="305" x2="600" y2="330" stroke="#6b4c9a" stroke-width="2"/>
  <polygon points="600,330 595,320 605,320" fill="#6b4c9a"/>
  <text x="620" y="323" font-family="Arial, sans-serif" font-size="9" fill="#64748b">load_view_tko</text>
  
  <!-- Tile -->
  <rect x="460" y="330" width="280" height="120" rx="8" fill="url(#tileGradient)" filter="url(#shadow)"/>
  <text x="600" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">tile</text>
  <text x="600" y="375" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">shape=16x16</text>
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">element_type=f32</text>
  <text x="600" y="405" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">implicit layout</text>
  
  <!-- Legend -->
  <rect x="250" y="460" width="300" height="30" rx="5" fill="#f1f5f9"/>
  <circle cx="280" cy="475" r="6" fill="url(#memoryGradient)"/>
  <text x="295" y="478" font-family="Arial, sans-serif" font-size="10" fill="#475569">Global Memory</text>
  <circle cx="370" cy="475" r="6" fill="url(#viewGradient)"/>
  <text x="385" y="478" font-family="Arial, sans-serif" font-size="10" fill="#475569">Partition</text>
  <circle cx="470" cy="475" r="6" fill="url(#tileGradient)"/>
  <text x="485" y="478" font-family="Arial, sans-serif" font-size="10" fill="#475569">Tile Buffer</text>
</svg>
